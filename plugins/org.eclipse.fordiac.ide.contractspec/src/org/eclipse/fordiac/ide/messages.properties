EmptyIntervalWarning=Interval is empty. The first number should be smaller than the second.
DegenerateIntervalWarning=Interval consists of a single number.
OutputPortExpectedError=Expected output ports, but %s is an input port.
InputPortExpectedError=Expected input ports, but %s is an output port.

EmptyIntervalQuickfixLabel=Swap values
EmptyIntervalQuickfixDescription=Swaps the two values of the interval.
DegenerateIntervalQuickfixLabel=Simplify interval
DegenerateIntervalQuickfixDescription=Replace interval with a single number.

SlidingWindowNotNeededWarning="N out of M times" term not needed since N is equal to M.
SlidingWindowInvalidError="N out of M times" term invalid. N must be smaller then M.

ClockAlreadyDefinedError=A clock with this name is already defined.
MaxdiffAndSkewError=Maxdiff and skew properties cannot be used in conjunction with each other.
MaxdiffAndDriftError=Maxdiff and drift properties cannot be used in conjunction with each other.
SkewWithoutResolutionError=Skew requires the presence of the resolution property.
SkewLTResolutionError=Skew must be smaller than the resolution.

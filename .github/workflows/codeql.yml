name: CodeQL call

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  checks: write
  pull-requests: write
  security-events: write
  contents: read
  issues: read
  actions: read

jobs:
  callCodeQLworkflow:
    uses: eclipse-platform/eclipse.platform.releng.aggregator/.github/workflows/codeQLworkflow.yml@master
